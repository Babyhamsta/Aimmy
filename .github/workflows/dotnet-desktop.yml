name: Build Aimmy

on:
  push:
    branches: [ "Aimmy-V2" ]
    paths:
      - 'Aimmy2/**'
      - 'Aimmy2.sln'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/dotnet-desktop.yml'
  pull_request:
    branches: [ "Aimmy-V2" ]
    paths:
      - 'Aimmy2/**'
      - 'Aimmy2.sln'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/dotnet-desktop.yml'
  workflow_dispatch: # Lets you trigger a build manually from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Publish Release (win-x64)
        run: >
          dotnet publish Aimmy2/Aimmy2.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          --self-contained false
          -o publish/win-x64

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aimmy2-win-x64-${{ github.run_number }}
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14
