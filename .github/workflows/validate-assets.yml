name: Validate model submissions

on:
  pull_request_target:
    branches: [Aimmy-V2]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

# Never run contributor code here. Both checkouts are of the trusted workflow SHA.
permissions: {}
concurrency:
  group: asset-submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report: ${{ steps.validate.outputs.report || steps.inspect.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/asset-submissions
      - name: Inspect the complete, immutable PR diff
        id: inspect
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const policy = require('./.github/scripts/asset-submissions/submissions.cjs');
            await policy.prepare({ github, context, core });
      - name: Build the trusted static parser
        if: steps.inspect.outputs.eligible == 'true'
        run: docker build --pull --tag aimmy-asset-validator .github/scripts/asset-submissions
      - name: Validate data in a restricted container
        if: steps.inspect.outputs.eligible == 'true'
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const policy = require('./.github/scripts/asset-submissions/submissions.cjs');
            await policy.validate({ github, context, core });

  publish:
    needs: validate
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/asset-submissions
      - name: Recheck scope and publish the exact-head result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          VALIDATION_REPORT: ${{ needs.validate.outputs.report }}
          VALIDATION_JOB_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const policy = require('./.github/scripts/asset-submissions/submissions.cjs');
            await policy.publish({ github, context, core });
